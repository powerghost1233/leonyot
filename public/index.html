<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>León TV Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e9edf6;font:15px system-ui,Arial}.layout{max-width:1200px;margin:auto;padding:30px}h1{color:#f4c46a}h2{font-size:20px}button,input,select,textarea{font:inherit;border-radius:9px;padding:11px;border:1px solid #35415b}input,select,textarea{background:#151f35;color:white;width:100%}button{background:#e9b857;color:#13151e;cursor:pointer;font-weight:700}button.secondary{background:#25324d;color:white}button.danger{background:#783d46;color:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}.tile,.panel{background:#151d31;border:1px solid #293651;border-radius:16px;padding:20px;margin:14px 0}.tile strong{display:block;font-size:30px;margin-top:8px}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:7px}.muted{color:#a9b4cb}.client{border-top:1px solid #303b55;padding:15px 0}.client:first-child{border-top:0}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#253451;margin:4px}.good{color:#70d7a1}.bad{color:#ff8d96}.hidden{display:none!important}#login{max-width:390px;margin:12vh auto}#message{color:#ff9c9c;min-height:20px}@media(max-width:600px){.layout{padding:14px}}</style></head><body><section id="login" class="panel"><h1>🦁 León TV</h1><p class="muted">Acceso administrativo</p><form id="loginForm"><input id="username" placeholder="Usuario" autocomplete="username" required><br><br><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required><br><br><button>Entrar</button></form><p id="message"></p></section><main id="app" class="layout hidden"><header class="actions" style="justify-content:space-between;align-items:center"><h1>🦁 León TV Admin</h1><button class="secondary" id="logout">Salir</button></header><div id="stats" class="grid"></div><section class="panel"><h2 id="formTitle">Nuevo cliente</h2><form id="clientForm"><input type="hidden" id="clientId"><div class="formgrid"><input id="name" placeholder="Nombre *" required><input id="phone" placeholder="Teléfono"><input id="email" type="email" placeholder="Email"><input id="notes" placeholder="Notas"></div><br><div class="actions"><button>Guardar cliente</button><button type="button" class="secondary" id="reset">Cancelar edición</button></div></form></section><section class="panel"><h2>Clientes y suscripciones</h2><input id="search" placeholder="Buscar por nombre, teléfono o correo"><div id="clients"></div></section><section class="panel"><h2>Últimas renovaciones</h2><div id="renewals"></div></section></main><script>
const $=id=>document.getElementById(id);let clients=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,options={}){let r=await fetch('/api'+url,{...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});let data=await r.json();if(!r.ok)throw Error(data.error||'Error');return data}const post=(url,obj,method='POST')=>api(url,{method,body:JSON.stringify(obj)});function show(logged){$('login').classList.toggle('hidden',logged);$('app').classList.toggle('hidden',!logged)}async function load(){try{let [s,c,r]=await Promise.all([api('/stats'),api('/clients'),api('/renewals')]);clients=c;$('stats').innerHTML=[['Clientes',s.clients],['Activos',s.active],['Vencidos',s.expired],['Vencen en 15 días',s.expiring]].map(([a,b])=>`<div class="tile">${a}<strong>${b}</strong></div>`).join('');render();$('renewals').innerHTML=r.length?r.map(x=>`<p>${esc(x.name)} · ${x.months} meses · ${esc(x.new_expiry).slice(0,10)} · ${x.amount} €</p>`).join(''):'Todavía no hay renovaciones';}catch(e){alert(e.message)}}function render(){let q=$('search').value.toLowerCase();$('clients').innerHTML=clients.filter(c=>[c.name,c.phone,c.email].some(x=>String(x||'').toLowerCase().includes(q))).map(c=>`<div class="client"><div class="actions" style="justify-content:space-between"><b>${esc(c.name)}</b><div class="actions"><button class="secondary" onclick="editClient(${c.id})">Editar</button><button class="danger" onclick="removeClient(${c.id})">Eliminar</button></div></div><p class="muted">${esc(c.phone)} · ${esc(c.email)} · ${esc(c.notes)}</p>${c.subscriptions.map(s=>`<p><span class="pill">${esc(s.plan)} · ${s.connections} conexión(es) · ${s.price} €</span> Hasta ${esc(s.expires_at).slice(0,10)} <span class="${s.expires_at.slice(0,10)>=new Date().toISOString().slice(0,10)?'good':'bad'}">●</span> <button class="secondary" onclick="renew(${s.id})">Renovar</button></p>`).join('')}<button onclick="subscribe(${c.id})">+ Suscripción</button></div>`).join('')||'<p class="muted">No hay clientes.</p>'}window.editClient=id=>{let c=clients.find(x=>x.id===id);['name','phone','email','notes'].forEach(k=>$(k).value=c[k]||'');$('clientId').value=id;$('formTitle').textContent='Editar cliente';window.scrollTo(0,0)};function reset(){ $('clientForm').reset();$('clientId').value='';$('formTitle').textContent='Nuevo cliente'}$('reset').onclick=reset;$('clientForm').onsubmit=async e=>{e.preventDefault();let id=$('clientId').value;try{await post(id?'/clients/'+id:'/clients',Object.fromEntries(['name','phone','email','notes'].map(k=>[k,$(k).value])),id?'PUT':'POST');reset();load()}catch(e){alert(e.message)}};window.removeClient=async id=>{if(confirm('¿Eliminar cliente y todo su historial?')){try{await api('/clients/'+id,{method:'DELETE'});load()}catch(e){alert(e.message)}}};window.subscribe=async id=>{let plan=prompt('Plan (ej. 12 meses)');if(!plan)return;let connections=prompt('Número de conexiones','1');let price=prompt('Precio en euros','69');let starts_at=prompt('Inicio (AAAA-MM-DD)',new Date().toISOString().slice(0,10));let d=new Date(starts_at+'T12:00:00');if(isNaN(d))return alert('Fecha inválida');let months=Number.parseInt(plan)||12;d.setMonth(d.getMonth()+months);let expires_at=prompt('Vencimiento (AAAA-MM-DD)',d.toISOString().slice(0,10));try{await post('/clients/'+id+'/subscriptions',{plan,connections:Number(connections),price:Number(price),starts_at,expires_at});load()}catch(e){alert(e.message)}};window.renew=async id=>{let months=prompt('Renovar cuántos meses (1, 3, 6, 12)','12');if(months===null)return;let amount=prompt('Importe cobrado en euros','0');if(amount===null)return;try{await post('/subscriptions/'+id+'/renew',{months:Number(months),amount:Number(amount)});load()}catch(e){alert(e.message)}};$('search').oninput=render;$('loginForm').onsubmit=async e=>{e.preventDefault();try{await post('/login',{username:$('username').value,password:$('password').value});show(true);load()}catch(e){$('message').textContent=e.message}};$('logout').onclick=async()=>{await post('/logout',{});show(false)};api('/me').then(x=>{show(x.authenticated);if(x.authenticated)load()});
</script></body></html>
